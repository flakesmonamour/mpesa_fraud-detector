# ================================================================
# M-Pesa Fraud Detection Pipeline — Full Stack
# Services: Zookeeper, Kafka, Kafka UI, PostgreSQL, Airflow, Streamlit Dashboard
# Start everything: docker compose up -d
# Dashboard: http://localhost:8501
# Airflow:   http://localhost:8080
# Kafka UI:  http://localhost:8081
# ================================================================

services:

  # ── ZOOKEEPER ──────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - fraud_net

  # ── KAFKA ──────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fraud_net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── KAFKA UI ────────────────────────────────────────────────────
  # Browser UI to inspect topics, partitions, and messages live.
  # http://localhost:8081
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - fraud_net

  # ── POSTGRESQL (fraud data) ────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres_fraud
    environment:
      POSTGRES_USER: mark
      POSTGRES_PASSWORD: fraud2025
      POSTGRES_DB: mpesa_fraud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - fraud_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mark -d mpesa_fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── POSTGRESQL (airflow metadata) ─────────────────────────────
  postgres_airflow:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    networks:
      - fraud_net

  # ── AIRFLOW WEBSERVER ─────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.7.0
    container_name: airflow_webserver
    depends_on:
      - postgres_airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: mpesa_fraud_secret
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - fraud_net

  # ── AIRFLOW SCHEDULER ─────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.7.0
    container_name: airflow_scheduler
    depends_on:
      - postgres_airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    command: scheduler
    networks:
      - fraud_net

  # ── STREAMLIT DASHBOARD ───────────────────────────────────────
  dashboard:
    image: python:3.11-slim
    container_name: mpesa_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres_fraud
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mpesa_fraud
      POSTGRES_USER: mark
      POSTGRES_PASSWORD: fraud2025
    command: >
      bash -c "pip install --quiet streamlit psycopg2-binary &&
               streamlit run dashboard.py
               --server.port=8501
               --server.address=0.0.0.0
               --server.headless=true"
    networks:
      - fraud_net
    restart: unless-stopped

networks:
  fraud_net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log: